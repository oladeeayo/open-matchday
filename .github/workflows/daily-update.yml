name: Daily data update

# Runs every day at 12:00 AM (00:00) UTC.
# Purpose: pick up THAT day's match results everywhere, and catch newly
# published fixtures — including each new domestic-cup round as it is drawn
# (a draw becomes visible within a day, which covers "once per round").
# League fixture DATE/TIME stability is re-checked monthly by monthly-data-audit.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build all leagues
        run: python build.py

      # Gate: never push structurally broken data. A red run emails the
      # maintainer; fix the reported error, then re-run via workflow_dispatch.
      - name: Validate data correctness
        run: python scripts/check_data.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No data changes today."
          else
            git commit -m "Daily data refresh $(date -u +%F)"
            git push
          fi
