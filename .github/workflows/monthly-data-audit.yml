name: Monthly data audit

# Runs on the 1st of every month at 01:00 UTC (plus manual dispatch).
# 1. Rebuilds from live sources — confirms league fixture dates/times still
#    stand (any moved fixture shows up in the diff below).
# 2. Diffs against the previous month: date changes, added/removed fixtures,
#    score corrections -> written to the job summary.
# 3. Runs the full correctness check over data/ (row sums, dates, scores).
# 4. Pushes the refreshed data if anything changed.
on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monthly-data-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot current data
        run: cp -r data data_before

      - name: Rebuild from live sources
        run: python build.py

      - name: Fixture date/time stability + change report
        run: |
          {
            echo "## Monthly change report (previous month vs now)"
            echo '```'
            python scripts/diff_build.py data_before data | head -n 500
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Correctness check of data folders
        run: python scripts/check_data.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -q data_before
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Monthly audit refresh $(date -u +%F)"
            git push
          fi
